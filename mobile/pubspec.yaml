name: player_book
description: Audiobook player for Android.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  just_audio: ^0.9.40
  just_audio_background: ^0.0.1-beta.13
  audio_session: ^0.1.21
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  drift: ^2.19.1
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  sensors_plus: ^6.0.1
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  shared_preferences: ^2.3.2
  collection: ^1.18.0
  webdav_client: ^1.2.2
  dio: ^5.11.1
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.19.1
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  generate: true
